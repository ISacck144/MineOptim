# ─────────────────────────────────────────────────────────────────────────────
# Escenario ANDINO: 4,100 msnm, temporada de lluvias.
# Modela las condiciones reales de minas peruanas de cobre (Antapaccay,
# Las Bambas, Toquepala, Cuajone). Los sistemas comerciales fueron calibrados
# en Nevada, Chile y Australia — este es el diferencial de APU.
#
# AVISO: Datos SINTÉTICOS. Ver README.md para metodología de generación.
# ─────────────────────────────────────────────────────────────────────────────

nombre: "Mina Andina (4,100 msnm, Temporada de Lluvias)"
altitud_msnm: 4100

simulacion:
  duracion_horas: 12
  seed: 42

palas:
  - id: pala_1
    ley_cu: 0.78
    ley_as: 0.05
    es_mineral: true
    capacidad_ton_h: 4400       # menor que el nivel del mar por altitud
    tiempo_carga_min: 4.5       # operario más lento en altura
    pos_x: 200.0
    pos_y: 800.0

  - id: pala_2
    ley_cu: 0.52
    ley_as: 0.03
    es_mineral: true
    capacidad_ton_h: 4000
    tiempo_carga_min: 4.0
    pos_x: 300.0
    pos_y: 1500.0

  - id: pala_3
    ley_cu: 0.18
    ley_as: 0.01
    es_mineral: false
    capacidad_ton_h: 3600
    tiempo_carga_min: 5.0
    pos_x: 500.0
    pos_y: 2200.0

camiones:
  - id: truck_1
    tipo: CAT793
    capacidad_ton: 227

  - id: truck_2
    tipo: CAT793
    capacidad_ton: 227

  - id: truck_3
    tipo: CAT793
    capacidad_ton: 227

  - id: truck_4
    tipo: Komatsu930E
    capacidad_ton: 290

  - id: truck_5
    tipo: Komatsu930E
    capacidad_ton: 290

destinos:
  - id: chancadora
    tipo: chancadora
    pos_x: 4500.0
    pos_y: 0.0
    tiempo_descarga_min: 1.5
    capacidad_ton_h: 10000

  - id: botadero
    tipo: botadero
    pos_x: 3000.0
    pos_y: 500.0
    tiempo_descarga_min: 1.0
    capacidad_ton_h: .inf

# Tiempos de viaje en condiciones de lluvia/altitud: ~15–20% más lentos.
# La resistencia a la rodadura sube de ~0.02 (seco) a ~0.05 (mojado).
# En v2 estos se calcularán dinámicamente con el módulo de física.
tiempos_viaje_min:
  pala_1:
    chancadora: 13.5
    botadero: 9.0
    pala_2: 5.0
    pala_3: 8.5

  pala_2:
    chancadora: 11.5
    botadero: 8.0
    pala_1: 5.0
    pala_3: 5.5

  pala_3:
    chancadora: 9.5
    botadero: 6.5
    pala_1: 8.5
    pala_2: 5.5

  chancadora:
    pala_1: 11.5
    pala_2: 9.5
    pala_3: 7.5
    botadero: 3.5

  botadero:
    pala_1: 8.0
    pala_2: 6.5
    pala_3: 5.5
    chancadora: 3.5

despacho:
  lambda_acoplamiento: 0.3
  intervalo_pl_min: 30

# Parámetros de física de altitud (activos en v2)
# VALIDAR con tablas del fabricante antes de usar en producción
fisica:
  motor:
    tipo_aspiracion: turboalimentado   # opciones: aspirado | turboalimentado
    coef_derateo_por_300m: 0.012       # VALIDAR con tablas del fabricante
    altitud_referencia_msnm: 3000      # turbo: pérdida significativa desde aquí

  rodadura:
    tipo_base: tierra_compactada
    coef_base: 0.025                   # condición seca normal
    coef_lluvia: 0.048                 # VALIDAR con ensayos de campo
    degradacion_por_hora: 0.0001       # tasa de aumento de coef por hora de uso

planta:
  ley_cu_min: 0.40
  ley_cu_max: 0.90
  ley_as_max: 0.10

# ─────────────────────────────────────────────────────────────────────────────
# Configuración v2 — escenario andino
# ─────────────────────────────────────────────────────────────────────────────
v2:
  snapshot_intervalo_min: 10

  despacho:
    intervalo_pl_min: 30

  fisica:
    ruido_viaje_sigma: 0.10    # mayor variabilidad por lluvia y caminos blandos

  ml:
    activado: true
    burn_in_min: 120
    threshold_degradacion: 0.12   # umbral más sensible en condiciones difíciles

  eventos:
    programados:
      - tipo: falla_pala
        pala_id: pala_2
        tiempo_min: 300.0
        duracion_min: 90.0

    aleatorios:
      activado: false
